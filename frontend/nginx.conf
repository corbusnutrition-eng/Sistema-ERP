# Sirve el SPA de React y hace reverse proxy de /api y /uploads hacia el
# contenedor backend, así frontend y backend quedan en el mismo origen
# (mismo dominio) y el navegador sí envía la cookie HttpOnly de sesión —
# ver la nota de cookies cross-subdominio en GUIA_DESPLIEGUE.md.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Assets con hash en el nombre (Vite): cacheables de forma agresiva.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # React Router: cualquier ruta desconocida cae al index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
