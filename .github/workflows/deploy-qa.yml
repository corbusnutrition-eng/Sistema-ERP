name: Deploy QA

# Dispara en cada push a `dev`: construye backend y frontend, los publica en
# GHCR y despliega en el VPS de QA por SSH. El deploy a `main` (producción)
# se añadirá como un workflow aparte más adelante, reusando estas mismas
# imágenes/Dockerfiles.
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-qa
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/corbusnutrition-eng/sistema-erp-backend
  FRONTEND_IMAGE: ghcr.io/corbusnutrition-eng/sistema-erp-frontend

permissions:
  contents: read
  packages: write

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:qa
            ${{ env.BACKEND_IMAGE }}:qa-${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Las variables VITE_* quedan incrustadas en el bundle en tiempo de
      # build: se definen como Variables del repo (Settings → Secrets and
      # variables → Actions → Variables), no como secrets, porque terminan
      # visibles en el JS servido al navegador de todos modos.
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.QA_VITE_API_BASE_URL }}
            VITE_CODIGOS_RETIRO_BASE_URL=${{ vars.QA_VITE_CODIGOS_RETIRO_BASE_URL }}
            VITE_CODIGOS_RETIRO_ES_PRUEBA=${{ vars.QA_VITE_CODIGOS_RETIRO_ES_PRUEBA }}
          tags: |
            ${{ env.FRONTEND_IMAGE }}:qa
            ${{ env.FRONTEND_IMAGE }}:qa-${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      # Requiere en el VPS: docker + el plugin `docker compose`, y
      # VPS_DEPLOY_PATH apuntando a un `git clone` dedicado de este repo
      # (checkout de `dev`) que contenga docker-compose.prod.yml y un
      # backend/.env ya configurado a mano (nunca viaja por CI).
      #
      # Secrets requeridos (Settings → Secrets and variables → Actions):
      #   VPS_SSH_HOST, VPS_SSH_USER, VPS_SSH_KEY, VPS_DEPLOY_PATH
      # Opcional: VPS_SSH_PORT (default 22)
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_SSH_HOST }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_ACTOR,BACKEND_IMAGE,FRONTEND_IMAGE,BACKEND_TAG,FRONTEND_TAG,DEPLOY_PATH
          script: |
            set -e
            cd "$DEPLOY_PATH"

            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin

            export BACKEND_IMAGE="${BACKEND_IMAGE}:${BACKEND_TAG}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}:${FRONTEND_TAG}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          BACKEND_TAG: qa-${{ github.sha }}
          FRONTEND_TAG: qa-${{ github.sha }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
